[package]
name = "ss-led"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Allocation-free async RMT driver for WS281x RGB/RGBW LEDs on ESP32-C3/C6"
license = "MIT"
repository = "https://github.com/koro33e/ss-led"
readme = "README.md"
keywords = ["esp32", "ws2812", "rmt", "led", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]
include = ["src/**", "examples/**", ".cargo/config.toml", "rust-toolchain.toml", "README.md", "LICENSE"]

[features]
default = []
esp32c3 = ["esp-hal/esp32c3", "esp-bootloader-esp-idf/esp32c3", "esp-println/esp32c3", "esp-rtos/esp32c3"]
esp32c6 = ["esp-hal/esp32c6", "esp-bootloader-esp-idf/esp32c6", "esp-println/esp32c6", "esp-rtos/esp32c6"]
defmt = ["dep:defmt", "esp-hal?/defmt"]

[dependencies]
esp-hal = { version = "~1.2.2", default-features = false, features = ["unstable"], optional = true }
defmt = { version = "1.2.0", optional = true }

[target.'cfg(target_os = "none")'.dev-dependencies]
embassy-executor = "0.10"
embassy-time = "0.5"
esp-bootloader-esp-idf = { version = "0.6", default-features = false }
esp-hal = { version = "~1.2.2", features = ["unstable"] }
esp-println = { version = "0.18", features = ["defmt-espflash"] }
esp-rtos = { version = "0.4", features = ["embassy"] }

[[example]]
name = "ws2812b"
required-features = ["esp-hal"]

[package.metadata.docs.rs]
default-target = "riscv32imac-unknown-none-elf"
features = ["esp32c6", "defmt"]

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
