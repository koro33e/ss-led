name: CI

on: [push, pull_request]

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo check --locked --features defmt
      - run: cargo clippy --locked --all-targets -- -D warnings

  embedded:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - chip: esp32c3
            target: riscv32imc-unknown-none-elf
          - chip: esp32c6
            target: riscv32imac-unknown-none-elf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - run: cargo check --locked --release --lib --features ${{ matrix.chip }} --target ${{ matrix.target }}
      - run: cargo build --locked --release --example ws2812b --features ${{ matrix.chip }} --target ${{ matrix.target }}
      - run: cargo build --locked --release --example ws2812b --features ${{ matrix.chip }},defmt --target ${{ matrix.target }}
      - run: cargo clippy --locked --release --lib --examples --features ${{ matrix.chip }},defmt --target ${{ matrix.target }} -- -D warnings
      - run: cargo doc --locked --release --no-deps --features ${{ matrix.chip }},defmt --target ${{ matrix.target }}
        env:
          RUSTDOCFLAGS: -D warnings
